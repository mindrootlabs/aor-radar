name: Daily AOR scan

on:
  schedule:
    - cron: "0 2 * * *"   # 07:30 IST every day
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: aor-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run collector
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python collector/main.py
      - name: Commit results
        run: |
          git config user.name "aor-radar-bot"
          git config user.email "aor-radar-bot@users.noreply.github.com"
          git add docs/openings.json data/seen.json
          git diff --staged --quiet || git commit -m "Daily update $(date -u +%F)"
          git push
