# AOR Radar - sources and search queries.
# Edit freely. Feeds/queries that fail are logged and skipped, they never break the run.

# How far back web search looks. pm = past month. Duplicates are filtered by the seen list,
# so a wide window does not cause repeat emails.
search_freshness: pm

# Web search queries (needs BRAVE_API_KEY). Each query costs one search credit per run.
# Job-board queries use site: so results come from places that actually list postings.
search_queries:
  - 'hiring "advocate on record" retainer OR retainership OR "on retainer" India'
  - 'site:katcheri.in "advocate on record" OR AOR retainer OR retainership OR empanelment'
  - "AOR required Supreme Court of India law firm retainer"
  - 'site:lawctopus.com "advocate on record" OR AOR Supreme Court'
  - 'site:legallyindia.com "advocate on record" OR AOR job'
  - 'site:in.indeed.com "advocate on record" OR AOR Supreme Court'
  - 'site:naukri.com "advocate on record" OR AOR Supreme Court'
  - "empanelment panel of advocates Supreme Court of India invites applications"
  - 'India panel counsel "advocate on record" empanelment bank OR PSU OR commission OR corporation'
  - 'India expression of interest legal services Supreme Court of India "advocate on record"'

# Results from these sites are dropped before they reach the AI filter (saves cost, cuts noise).
blocked_domains:
  - supremecourt.gov
  - uscourts.gov
  - usajobs.gov
  - justice.gov
  - nycourts.gov
  - statejobs.ny.gov
  - pewpewtactical.com
  - hklaw.com
  - opindia.com
  - indiatoday.in
  - thehindu.com
  - indianexpress.com
  - thehansindia.com
  - newindianexpress.com
  - verdictum.in
  - lawtrend.in
  - lawchakra.in
  - indialegallive.com
