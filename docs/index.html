<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AOR Radar</title>
<style>
  :root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a64;--line:#e4e2db;--accent:#1f4d3a;--new:#b4540a;--warn:#a32d2d}
  @media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#1f1f1c;--ink:#ecebe5;--mute:#9a988f;--line:#33322d;--accent:#6fbf98;--new:#e8924a;--warn:#e07070}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  h1{font-size:22px;margin:0;font-weight:650}
  .sub{color:var(--mute);font-size:13px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
  .bar input,.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
  .bar input{flex:1;min-width:180px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
  .card.done{opacity:.55}
  .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .title{font-weight:600;font-size:16px;margin:0 0 2px}
  .meta{color:var(--mute);font-size:13px}
  .sum{margin:8px 0 10px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
  .tag.new{color:var(--new);border-color:var(--new);font-weight:600}
  .tag.soon{color:var(--warn);border-color:var(--warn);font-weight:600}
  .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  a.apply{background:var(--accent);color:#fff;text-decoration:none;padding:7px 16px;border-radius:8px;font-weight:600;font-size:14px}
  button.sm{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
  .empty{text-align:center;color:var(--mute);padding:50px 10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AOR Radar</h1>
    <span class="sub" id="updated">Loading…</span>
  </header>

  <div class="chips" id="views"></div>
  <div class="bar">
    <input id="q" type="search" placeholder="Search title, organisation, city…">
    <select id="type">
      <option value="">All types</option>
      <option value="panel">Panel / empanelment</option>
      <option value="job">Job / retainer</option>
      <option value="tender">Tender</option>
      <option value="other">Other</option>
    </select>
    <select id="sort">
      <option value="new">Newest first</option>
      <option value="deadline">Deadline soonest</option>
    </select>
  </div>

  <div id="list"></div>
  <p class="sub" style="margin-top:24px">Openings are collected automatically from public sources and filtered by AI. Always confirm details on the original notice before applying.</p>
</div>

<script>
const $ = s => document.querySelector(s);
let items = [], view = "active";
const store = {
  get(){ try { return JSON.parse(localStorage.getItem("aor-state")||"{}"); } catch(e){ return {}; } },
  set(o){ try { localStorage.setItem("aor-state", JSON.stringify(o)); } catch(e){} }
};
let state = store.get();   // id -> "applied" | "ignored"
const today = new Date().toISOString().slice(0,10);
const daysAgo = d => Math.floor((new Date(today) - new Date(d)) / 864e5);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : "#";

function render(){
  const q = $("#q").value.toLowerCase(), t = $("#type").value, sort = $("#sort").value;
  let rows = items.filter(i => {
    const st = state[i.id];
    if (view === "active" && st) return false;
    if (view === "new" && (st || daysAgo(i.first_seen) > 1)) return false;
    if (view === "applied" && st !== "applied") return false;
    if (view === "ignored" && st !== "ignored") return false;
    if (t && i.type !== t) return false;
    if (q && !(`${i.title} ${i.org} ${i.location} ${i.summary}`.toLowerCase().includes(q))) return false;
    return true;
  });
  rows.sort(sort === "deadline"
    ? (a,b) => (a.deadline||"9999").localeCompare(b.deadline||"9999")
    : (a,b) => b.first_seen.localeCompare(a.first_seen));

  $("#list").innerHTML = rows.length ? rows.map(i => {
    const age = daysAgo(i.first_seen);
    const left = i.deadline ? Math.ceil((new Date(i.deadline) - new Date(today)) / 864e5) : null;
    const st = state[i.id];
    return `<div class="card ${st ? "done" : ""}">
      <div class="top"><div>
        <p class="title">${esc(i.title)}</p>
        <div class="meta">${[i.org, i.location, i.source].filter(Boolean).map(esc).join(" · ")}</div>
      </div></div>
      ${i.summary ? `<div class="sum">${esc(i.summary)}</div>` : ""}
      <div class="tags">
        ${age <= 1 ? '<span class="tag new">NEW</span>' : `<span class="tag">${age}d ago</span>`}
        <span class="tag">${esc(i.type)}</span>
        ${left !== null ? `<span class="tag ${left <= 7 ? "soon" : ""}">${left >= 0 ? "closes in " + left + "d (" + esc(i.deadline) + ")" : "closed"}</span>` : ""}
        ${st ? `<span class="tag">${st}</span>` : ""}
      </div>
      <div class="actions">
        <a class="apply" href="${safeUrl(i.url)}" target="_blank" rel="noopener noreferrer">Open / Apply ↗</a>
        ${st ? `<button class="sm" data-id="${esc(i.id)}" data-s="">Restore</button>` : `
          <button class="sm" data-id="${esc(i.id)}" data-s="applied">Mark applied</button>
          <button class="sm" data-id="${esc(i.id)}" data-s="ignored">Ignore</button>`}
      </div></div>`;
  }).join("") : '<div class="empty">Nothing here right now. The scan runs every morning.</div>';
}

function chips(){
  const names = {active:"Open", new:"New", applied:"Applied", ignored:"Ignored"};
  $("#views").innerHTML = Object.entries(names).map(([k,v]) =>
    `<button class="chip ${view===k?"on":""}" data-v="${k}">${v}</button>`).join("");
}

document.addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (c){ view = c.dataset.v; chips(); render(); return; }
  const b = e.target.closest("button.sm"); if (b){
    if (b.dataset.s) state[b.dataset.id] = b.dataset.s; else delete state[b.dataset.id];
    store.set(state); render();
  }
});
["#q","#type","#sort"].forEach(s => $(s).addEventListener("input", render));

fetch("openings.json?t=" + Date.now()).then(r => r.json()).then(d => {
  items = d.items || [];
  $("#updated").textContent = d.updated
    ? "Last scan: " + new Date(d.updated).toLocaleString("en-IN", {dateStyle:"medium", timeStyle:"short"}) + " · " + items.length + " open"
    : "No scan has run yet";
  chips(); render();
}).catch(() => { $("#updated").textContent = "Could not load data"; chips(); render(); });
</script>
</body>
</html>
